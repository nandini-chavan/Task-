<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task Manager</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <main class="container">
        <header class="header">
            <p class="eyebrow">Daily planner</p>
            <h1>Task Manager</h1>
            <p class="subtitle">Stay organized and get more done every day.</p>
        </header>

        <form id="task-form" class="task-form" action="#" method="post">
            <label class="sr-only" for="task-input">New task</label>
            <input id="task-input" type="text" name="task" placeholder="Add a new task..." required autocomplete="off">
            <button type="submit">Add task</button>
        </form>

        <div class="summary">
            <span>Today</span>
            <span id="task-count">0 tasks</span>
        </div>

        <ul id="task-list" aria-live="polite"></ul>
        <p id="message" role="status" aria-live="polite"></p>
    </main>

    <script src="/static/script.js"></script>
</body>
</html>
